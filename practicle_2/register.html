<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register — CHARUSAT</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">CHARUSAT</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="events.html">Events</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="contact.html">Contact</a>
        <a href="sitemap.html">Site Map</a>
      </nav>
    </div>
  </header>

  <main class="container auth">
    <div class="card center-card">
      <h2 class="text-center">Create an account</h2>
      <form action="#" method="post" class="auth-form">
        <label>Name <input type="text" name="name" required placeholder="Enter your full name"></label>
        <label>Email <input type="email" name="email" required placeholder="student@charusat.edu.in"></label>
        <label>Password <input type="password" name="password" required placeholder="Choose a secure password"></label>
        <button class="btn full" type="submit">Register</button>
      </form>
      <p class="text-center">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Student registration page — CHARUSAT</p>
    </div>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login — CHARUSAT</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">CHARUSAT</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="events.html">Events</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="contact.html">Contact</a>
        <a href="sitemap.html">Site Map</a>
      </nav>
    </div>
  </header>

  <main class="container auth">
    <div class="card center-card">
      <h2 class="text-center">Student / Staff Login</h2>
      <form action="#" method="post" class="auth-form">
        <label>Email <input type="email" name="email" required placeholder="student@charusat.edu.in"></label>
        <label>Password <input type="password" name="password" required placeholder="Enter your password"></label>
        <button class="btn full" type="submit">Login</button>
        <p class="text-center">
          <a href="register.html">Register</a> &bull; <a href="contact.html">Need help?</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Student login page — CHARUSAT</p>
    </div>
  </footer>
</body>
</html>

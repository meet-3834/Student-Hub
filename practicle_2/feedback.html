<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Feedback — CHARUSAT</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">CHARUSAT</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="events.html">Events</a>
        <a href="contact.html">Contact</a>
        <a href="sitemap.html">Site Map</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card center-card">
      <h2 class="text-center">Submit Feedback</h2>
      <form action="#" method="post" class="contact-form">
        <label>Name <input type="text" name="name" required placeholder="Your Name"></label>
        <label>Email <input type="email" name="email" required placeholder="student@charusat.edu.in"></label>
        <label>Feedback <textarea name="feedback" required placeholder="Please write your feedback here..."></textarea></label>
        <button class="btn full" type="submit">Send Feedback</button>
      </form>
      <p class="text-center"><a href="dashboard.html">Back to Dashboard</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Feedback and support — CHARUSAT</p>
    </div>
  </footer>
</body>
</html>

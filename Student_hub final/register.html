<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register — CHARUSAT</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">CHARUSAT</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="events.html">Events</a>
        <a href="students.html">Students</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a href="sitemap.html">Site Map</a>
      </nav>
    </div>
  </header>

  <main class="container auth" style="max-width: 600px;">
    <div class="card center-card">
      <h2 class="text-center">Student Registration Form</h2>
      <form id="regForm" action="#" method="post" class="auth-form" novalidate>
        <!-- Name -->
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter full name" required>
        <span id="nameError" class="error-msg"></span>

        <!-- Email -->
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="student@charusat.edu.in" required>
        <span id="emailError" class="error-msg"></span>

        <!-- Mobile Number -->
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" required>
        <span id="mobileError" class="error-msg"></span>

        <!-- Password -->
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <div id="passwordMeter" class="strength-meter">
          <div id="strengthBar" class="strength-bar"></div>
        </div>
        <span id="strengthText" class="strength-text"></span>
        <span id="passwordError" class="error-msg"></span>

        <!-- Confirm Password -->
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
        <span id="confirmPasswordError" class="error-msg"></span>

        <!-- Course -->
        <label for="course">Course</label>
        <select id="course" name="course" required>
          <option value="">-- Select Course --</option>
          <option value="B.Tech Computer Engineering">B.Tech Computer Engineering</option>
          <option value="B.Tech IT">B.Tech IT</option>
          <option value="BCA">BCA</option>
          <option value="MCA">MCA</option>
        </select>
        <span id="courseError" class="error-msg"></span>

        <!-- Year -->
        <label for="year">Academic Year</label>
        <select id="year" name="year" required>
          <option value="">-- Select Year --</option>
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year">3rd Year</option>
          <option value="4th Year">4th Year</option>
        </select>
        <span id="yearError" class="error-msg"></span>

        <!-- Gender -->
        <fieldset class="gender-fieldset">
          <legend>Gender</legend>
          <label class="inline-label"><input type="radio" name="gender" value="Male"> Male</label>
          <label class="inline-label"><input type="radio" name="gender" value="Female"> Female</label>
          <label class="inline-label"><input type="radio" name="gender" value="Other"> Other</label>
        </fieldset>
        <span id="genderError" class="error-msg"></span>

        <!-- Terms Acceptance -->
        <label class="inline-label checkbox-label">
          <input type="checkbox" id="terms" name="terms" required> I accept the Terms & Conditions
        </label>
        <span id="termsError" class="error-msg"></span>

        <button class="btn full" type="submit">Register Student</button>
      </form>
      <p class="text-center mt-20">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Student registration page — CHARUSAT</p>
    </div>
  </footer>
<script src="script.js"></script>`r`n</body>
</html>
